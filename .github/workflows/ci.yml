name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm exec tsc --noEmit
        working-directory: client

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Hermetic proof of the self-improving brain loop (governor → trainer →
      # auto-rollback + safety gates). Self-modifies agent .md files, so it must
      # stay green on every commit. Runs against a throwaway HOME + DB.
      - run: pnpm test:brain

  # Guard the GATES, not just the app (audit gap 3 / roadmap Phase 3): the 110 toolkit mutation-fixture
  # suites prove every gate BLOCKS its known-bad input and PASSES its clean one — incl. #50 gate-fires
  # (a silently-inert gate/config can't read green) and the meta-gates (gate-integrity, vacuous-pass,
  # unproven-guards). Node 22 here (the toolkit has no better-sqlite3; theme-check needs 22) — the app
  # jobs above stay on 20. SKIP_MCP=1 keeps it hermetic (no network to shopify.dev).
  theme-gates:
    name: Theme gate suites (guard the gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # theme-toolkit ships no lockfile — use `npm install` (npm ci requires
      # a lockfile). Deps are pinned in package.json so the resolve is stable.
      - run: npm install --no-fund --no-audit
        working-directory: theme-toolkit
      - name: Run all gate fixture suites
        run: SKIP_MCP=1 node scripts/run-all-tests.mjs
        working-directory: theme-toolkit

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Repo uses pnpm — `npm audit` errors with ENOLOCK against pnpm-lock.yaml.
      - run: pnpm audit --audit-level=high --prod
      - run: pnpm audit --audit-level=high --prod
        working-directory: client
