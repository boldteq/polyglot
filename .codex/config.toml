[mcp_servers.boldteq-memory]
command = "node"
args = ["./src/intelligence/mcp-server.mjs"]

[mcp_servers.boldteq-memory.env]
INTEL_STORE = "local"
INTEL_EMBED_PROVIDER = "ollama"

[mcp_servers.shopify-dev]
command = "npx"
args = [
    "-y",
    "@shopify/dev-mcp@latest",
]

[mcp_servers.shopify-dev.env]
LIQUID_VALIDATION_MODE = "full"
OPT_OUT_INSTRUMENTATION = "true"
